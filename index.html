<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Writing Buddy</title>
        <link rel="stylesheet" href="styles.css" />
    </head>
    <header>
        <div class="heading">
            <button class="quit" id="quit"> x </button>
        </div>
    </header>
    <body>
        <div class="app">
            <h1>Writing Buddy</h1>
            <p>Never lose count again!</p>

            <button id="toggle-dark-mode"> <strong id="theme-source">Other</strong> Mode</button>
            <button id="reset-to-system">Reset to System Theme</button>

        </div>
        
        <div class="app">
            <div class="square">
                <label>Goal: </label>
                <input class="text" id="wcGoal"></input> 
            </div>

            <div>
                <label class="title"> Work Title </label>
            </div>  

            <div class="textareaGrid">                     
                <button id="copyBtn" class="copybutton">COPY</button>              
                <textarea id="writing"></textarea>
            </div>    
            <p> Word Count: <strong id="word-number">0</strong></p>       
        </div>
        
        <script src="script.js"></script>
        
    </body>
</html>
